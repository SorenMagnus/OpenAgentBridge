[build-system]
requires = ["hatchling"]
build-backend = "hatchling.backends"

[project]
name = "openagent-bridge"
version = "0.1.0"
description = "An orchestration bridge that coordinates AI coding agents with structured task management, verification, and human-in-the-loop approval."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["ai", "agent", "orchestration", "bridge"]
dependencies = [
    "psutil",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
openagent = "openagent_bridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openagent_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
